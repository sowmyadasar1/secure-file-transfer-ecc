# Render.com Blueprint — one-click deploy for SafeShare ECC
# See: https://render.com/docs/blueprint-spec

services:
  # ---------- FastAPI Backend ----------
  - type: web
    name: safeshare-ecc-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CRYPTO_MASTER_KEY
        generateValue: true            # Render auto-generates a 64-char hex secret
      - key: JWT_SECRET_KEY
        generateValue: true
    autoDeploy: true

  # ---------- React Frontend (Static Site) ----------
  - type: web
    name: safeshare-ecc-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://safeshare-ecc-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
